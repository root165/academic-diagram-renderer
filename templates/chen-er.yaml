title: 课程选课概念 E-R 图
section: 概念结构设计
purpose: 表达学生、课程及其选课业务关系，不表示表、主键或物理外键
diagram_type: erd
semantic_level: conceptual_er
notation: chen
visual_style:
  palette: monochrome
  background: "#FFFFFF"
  foreground: "#111111"
  fills: ["#FFFFFF", "#F2F2F2"]
  color_usage: none
source_requirements: [R-01]
assumptions:
  - 概念图只保留选课业务属性；用户账号、教室等支撑实体未纳入。
tbd: []
entities:
  - id: student
    name: 学生
    source_requirement: R-01
    attributes:
      - {name: 学号, key: PK, business: true}
      - {name: 姓名, business: true}
      - {name: 年级, business: true}
  - id: course
    name: 课程
    source_requirement: R-01
    attributes:
      - {name: 课程编号, key: PK, business: true}
      - {name: 课程名称, business: true}
      - {name: 学分, business: true}
relationships:
  - id: enrollment
    name: 选修
    left_entity: student
    right_entity: course
    left_to_right: {min: 0, max: N, meaning: 一个学生可选修零到多门课程}
    right_to_left: {min: 0, max: N, meaning: 一门课程可被零到多名学生选修}
    source_requirement: R-01
    resolves_to: enrollment_record
    attributes:
      - {name: 成绩, business: true}
      - {name: 选课时间, business: true}
